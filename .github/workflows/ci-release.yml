name: Build & Cross-Platform Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web-pwa:
    name: Build Web & PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Web/PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auramusic-web-pwa-dist
          path: dist/
